# Historical generated defaults from 95ec2ed (config_version 2.38.0).
# Fixture keys are empty defaults; this is not a user configuration.
[plugin]
enabled = true
config_version = "2.38.0"
image_cache_max_mb = 300
log_max_mb = 10
upload_cache_max_mb = 256

[proxy]
enabled = false
use_system_proxy = true
scheme = "http"
host = "127.0.0.1"
port = 7890
username = ""
password = ""
bypass_china_providers = true

[general]
default_model = ""
fallback_model = ""
fallback_models = []
request_retry_count = 1
request_timeout_seconds = 150
command_reply_mode = "图片"
failure_reason_enabled = true
permission_enabled = true
admin_user_ids = []
group_quota_enabled = true
group_quota_period = "daily"
group_default_quota = 5
private_quota_enabled = true
private_quota_period = "daily"
private_default_quota = 5
image_edit_unsupported_models = []
text_to_image_unsupported_models = []
prompt_review_enabled = false
prompt_review_prompt = "你是绘图提示词审核器。请判断下面的绘图提示词是否适合继续交给绘图模型生成。\n审核要求：\n1. 如果提示词涉及明显违法、暴力犯罪、血腥猎奇、未成年人色情、仇恨歧视、现实人物色情深度伪造等高风险内容，必须拒绝。\n2. 如果提示词内容普通、安全、可接受，则允许通过。\n3. 你的回复必须严格使用以下格式，不要输出多余内容：\n结论：PASS 或 REJECT\n原因：一句简短中文说明\n\n待审核提示词：\n{user_prompt}\n"
image_review_enabled = false
image_review_prompt = "你是绘图结果审核器。请审核这张图片是否适合直接发送给普通聊天场景。\n审核要求：\n1. 如果图片包含明显违法、暴力犯罪、血腥猎奇、未成年人色情、仇恨歧视、现实人物色情深度伪造等高风险内容，必须拒绝。\n2. 如果图片内容普通、安全、可接受，则允许通过。\n3. 结合本次生成提示词一起判断。\n4. 你的回复必须严格使用以下格式，不要输出多余内容：\n结论：PASS 或 REJECT\n原因：一句简短中文说明\n\n本次生成提示词：\n{user_prompt}\n"

